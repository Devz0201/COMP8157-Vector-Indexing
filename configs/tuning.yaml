# Parameter-tuning sweep -- closes the proposal's "parameter tuning" objective.
# Embeds the headlines once, then sweeps IVF's nprobe and HNSW's efSearch.
outdir: results/tuning
k: 10
warmup: 3
per_query: true

data:
  source: text
  path: data/headlines.txt
  max_chars: 280
  target_size: 20000
  n_query: 200
  seed: 42

embedding:
  backend: sbert
  model_name: all-MiniLM-L6-v2
  batch_size: 64

params:
  ivf:  { nlist: 100, ef_construction: 80 }
  hnsw: { M: 32, ef_construction: 80 }

tuning:
  ivf_nprobe:    [1, 2, 4, 8, 16, 32, 64, 100]   # 100 = search all clusters (= exact)
  hnsw_efsearch: [8, 16, 32, 64, 128, 256]       # wider search = higher recall
